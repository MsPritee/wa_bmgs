services:
  - type: web
    name: wa-api
    runtime: node
    plan: free
    rootDir: /
    buildCommand: npm ci && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build -w @wa/shared && npm run build -w @wa/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production